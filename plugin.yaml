name: hermes-alive
version: 2.9.8
manifest_version: 1
api_version: 1
description: Controlled proactive presence for Hermes with quiet hours, backpressure, and local state.
author: Awenforever
license: MIT
homepage: https://github.com/Awenforever/hermes-alive
tags: [gateway, proactive, messaging, lifecycle]
requires_hermes: ">=0.22.5,<0.23"
provides_hooks:
  - pre_tool_call
  - pre_api_request
  - post_tool_call
  - post_gateway_admission
python_dependencies:
  - "cryptography>=50.0.0,<51"
  - "PyYAML>=6.0.3,<7"
  - "tzdata>=2025.2"
  - "markdown-it-py>=4.0,<5"
config_schema:
  enabled:
    type: bool
    default: false
    description: Enable proactive delivery after setup and explicit operator consent.
  delivery_platform:
    type: str
    default: ""
    description: Optional Hermes channel name; empty captures the setup conversation channel.
  delivery_chat_id:
    type: str
    default: ""
    description: Optional channel destination; empty captures the setup conversation destination.
  llm_model:
    type: str
    default: ""
    description: Optional Hermes model alias; empty inherits the active primary model.
  llm_fallback_model:
    type: str
    default: ""
    description: Optional Hermes model alias; empty inherits Hermes fallback routing.
  min_interval_seconds:
    type: int
    default: 21600
    description: Minimum delay between proactive messages.
  quiet_hours_start:
    type: str
    default: "23:00"
    description: Local quiet-hours start in HH:MM.
  quiet_hours_end:
    type: str
    default: "08:00"
    description: Local quiet-hours end in HH:MM.
