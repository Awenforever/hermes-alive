name: hermes-alive
version: 2.8.10
manifest_version: 1
api_version: 1
description: Controlled proactive presence for Hermes with quiet hours, backpressure, and local state.
author: Awenforever
license: MIT
homepage: https://github.com/Awenforever/hermes-alive
tags: [gateway, proactive, weixin, lifecycle]
requires_hermes: ">=0.21.3,<0.22"
config_schema:
  enabled:
    type: bool
    default: false
    description: Enable proactive delivery after setup and explicit operator consent.
  delivery_platform:
    type: str
    default: weixin
    description: Messaging platform used for proactive delivery.
  min_interval_seconds:
    type: int
    default: 21600
    description: Minimum delay between proactive messages.
  quiet_hours_start:
    type: str
    default: "23:00"
    description: Local quiet-hours start in HH:MM.
  quiet_hours_end:
    type: str
    default: "08:00"
    description: Local quiet-hours end in HH:MM.
