name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Install CI dependency
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt

      - name: Repository and portable tests
        run: bash scripts/portable-ci.sh

  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install CI dependency
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt
      - name: Verify repository
        run: python scripts/verify-repository.py --root .
      - name: Compile runtime
        run: python -m compileall -q skills/hermes-alive
      - name: Exercise native filesystem and lifecycle
        run: |
          python skills/hermes-alive/__tests__/run_portable_filesystem.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python skills/hermes-alive/__tests__/run_plugin_cli_portable.py
          exit $LASTEXITCODE
