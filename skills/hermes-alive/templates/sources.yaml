# Hermes Alive discovery sources
# Branch: feat/playwright-multi-platform (2026-07-05)
# Sources by method:
#   API (aiohttp): arxiv, github, hackernews, v2ex, bilibili
#   News search (RSS): configurable current affairs, local, culture and light-interest lanes
#   RSS (aiohttp): sspai
#   Playwright: hackernews (direct), zhihu, papers.cool, jandan
#   Auth-required: 小红书（匿名抓取不作为可靠生产来源）
#   Pending research: 即刻(需用户协助找API endpoint)

network:
  # Leave blank unless this device needs an HTTP(S) proxy for discovery.
  # Example: http://192.168.1.10:7890
  proxy_url: ""

sources:
  arxiv:
    enabled: true
    query: "(satellite AND smoke detection) OR (remote sensing AND computer vision) OR (wildfire AND deep learning) OR (flame AND microgravity)"
    max_results: 3

  github:
    enabled: true
    query: "stars:>50 pushed:>2026-04-01"
    sort: stars
    per_page: 3

  hackernews:
    enabled: true
    max_stories: 15
    target_count: 3

  # New API-based sources (no Playwright needed)
  v2ex:
    enabled: true
    max_results: 3

  bilibili:
    enabled: true
    max_results: 3

  sspai:
    enabled: true
    max_results: 3

  # Editorial lanes are intentionally data-driven. Add or change queries here;
  # no Python patch is required to personalize region or interests.
  news_search:
    enabled: true
    max_results_per_query: 4
    queries:
      - name: "重要时事"
        lane: "current_affairs"
        query: "中国 国际 重大进展 when:3d"
        max_results: 4
        source_trust: 0.78
      - name: "合肥本地"
        lane: "local_hefei"
        query: "\"合肥\" (政策 OR 公示 OR 新规 OR 发布) when:7d"
        max_results: 4
        source_trust: 0.80
      - name: "人物与文化"
        lane: "culture_people"
        query: "作家 OR 艺术家 OR 文化 新作 OR 逝世 when:7d"
        max_results: 4
        source_trust: 0.72
      - name: "轻松趣闻"
        lane: "social_fun"
        query: "猫 OR 宠物 OR 趣闻 OR 网络热议 when:3d"
        max_results: 4
        source_trust: 0.62

  rss:
    enabled: false
    feeds: []

  playwright:
    enabled: true
    max_pages_per_run: 5
    timeout_seconds: 30
    delay_between_pages: 2.0
    sites:
      - name: "Hacker News"
        url: "https://news.ycombinator.com/"
        type: "forum"
      - name: "Zhihu Hot"
        url: "https://www.zhihu.com/hot"
        type: "social"
      - name: "papers.cool"
        url: "https://papers.cool/"
        type: "academic"
      - name: "煎蛋"
        url: "https://jandan.net/"
        type: "social"
      - name: "小红书"
        url: "https://www.xiaohongshu.com/explore"
        type: "social"
        enabled: false

dedup:
  enabled: true
  url_cache_size: 300

budgets:
  max_per_run: 18
  max_per_source: 12
  max_per_lane: 4
  lane_caps:
    academic: 2
    technology: 3
    current_affairs: 4
    local_hefei: 4
    culture_people: 3
    social_fun: 4

freshness:
  current_affairs: 168
  local_hefei: 336
  culture_people: 336
  social_fun: 168
  technology: 336
  academic: 720

editorial:
  lane_order:
    - current_affairs
    - local_hefei
    - social_fun
    - culture_people
    - technology
    - academic

share_threshold:
  min_score: 0.60

local_discovery:
  enabled: false
  allowed_roots: []
  denied_patterns:
    - "**/.env"
    - "**/auth.json"
    - "**/storage_state.json"
    - "**/*cookie*"
    - "**/*token*"
    - "**/*secret*"
    - "**/*credential*"
    - "**/*api_key*"
    - "**/*apikey*"
    - "**/*.tar.gz"
    - "**/*.zip"
    - "**/private/**"
    - "**/uploads/**"
  max_files_per_tick: 0
  max_file_size_bytes: 262144
